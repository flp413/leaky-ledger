rules:
  - id: jwt-decode-without-verification
    languages: [python]
    severity: ERROR
    message: >-
      jwt.decode() is called with signature verification turned off, so
      anyone can forge a token. Pass the key and an explicit algorithms=[...] list.
    metadata:
      cwe: "CWE-347: Improper Verification of Cryptographic Signature"
      owasp: "A07:2021 - Identification and Authentication Failures"
    pattern-either:
      - pattern: |
          jwt.decode(..., options={..., "verify_signature": False, ...}, ...)
      - pattern: jwt.decode(..., verify=False, ...)
